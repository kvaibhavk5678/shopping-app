<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign up - ShopApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav>
        <span class="brand">ShopApp</span>
    </nav>

    <div class="auth-box">
        <h1>Create your account</h1>
        <form th:action="@{/signup}" th:object="${signupForm}" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{username}" required autofocus>

            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" required>

            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" required minlength="6">

            <button class="btn" type="submit">Sign up</button>
        </form>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <a class="muted-link" th:href="@{/login}">Already have an account? Log in</a>
    </div>
</body>
</html>
